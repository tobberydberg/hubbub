name: Feature request
description: Suggest an idea for Hubbub
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: If Mattermost or the Nextcloud Talk web app already does this, a screenshot helps.
