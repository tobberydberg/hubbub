name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hubbub version
      placeholder: Settings → About
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux (AppImage), Linux (deb), Linux (rpm)]
    validations:
      required: true
  - type: input
    id: nextcloud
    attributes:
      label: Nextcloud and Talk version
      placeholder: e.g. Nextcloud 32, Talk 22.0.3 (Server Settings shows the Talk version)
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: View → Toggle Developer Tools → Console. Please remove any private information.
