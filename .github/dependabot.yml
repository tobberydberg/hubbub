version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New versions wait a week before they're proposed: malicious releases of npm packages are usually
    # found and pulled within days. Security updates come right away.
    cooldown:
      default-days: 7
    # Major versions of these need code or config changes (and @types/node follows Electron's Node),
    # so they are upgraded by hand
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      electron:
        patterns: ['electron', 'electron-*']
      build-tooling:
        patterns:
          [
            'vite',
            '@vitejs/*',
            'vitest',
            'typescript',
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            'prettier'
          ]
      react:
        patterns: ['react', 'react-dom', '@types/react*']
  # Actions are pinned to commit SHAs (the release workflow can read the signing certificate);
  # Dependabot updates the SHA and the version comment together
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
