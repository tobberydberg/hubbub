name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build installers for
# macOS, Windows and Linux and attach them to a draft GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Windows
            os: windows-latest
            args: --win
          - name: Linux
            os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERTS != '' }}
      HAS_WIN_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Code signing is optional. Without an Apple Developer ID (MAC_CERTS) macOS users allow the app
      # once under System Settings → Privacy & Security, and without WIN_CSC_LINK Windows shows a
      # SmartScreen prompt.
      #
      # Without a Developer ID, the macOS app is signed by scripts/sign-mac.cjs: with Hubbub's own
      # self-signed certificate (MAC_SELF_SIGNED_P12 and MAC_SELF_SIGNED_PASSWORD), so that macOS sees
      # every version as the same app and keeps permissions like Screen Recording across updates, or
      # else ad hoc, as Apple Silicon refuses to open an app whose bundle isn't sealed.
      - name: Disable code signing when no certificate is configured
        if: (runner.os == 'macOS' && env.HAS_MAC_CERT != 'true') || (runner.os == 'Windows' && env.HAS_WIN_CERT != 'true')
        shell: bash
        run: |
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = macOS ]; then
            echo "SIGNING_ARGS=-c.mac.identity=null" >> "$GITHUB_ENV"
            echo "HUBBUB_MAC_SIGN=1" >> "$GITHUB_ENV"
          fi

      - name: Load Hubbub's own macOS signing certificate
        if: runner.os == 'macOS' && env.HAS_MAC_CERT != 'true'
        shell: bash
        env:
          P12: ${{ secrets.MAC_SELF_SIGNED_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SELF_SIGNED_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No MAC_SELF_SIGNED_P12 secret: the macOS app is signed ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/hubbub-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign only finds identities in keychains on the search list
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-certificate -c "Hubbub Code Signing" -Z "$keychain" | awk '/SHA-1/ { print $NF; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::The signing certificate could not be loaded"
            exit 1
          fi
          echo "HUBBUB_MAC_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "HUBBUB_MAC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package and upload to the draft release
        shell: bash
        run: |
          # electron-builder treats an empty CSC_LINK as a certificate path, so drop unset secrets
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder ${{ matrix.args }} --publish always $SIGNING_ARGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing (base64 .p12) and notarization
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTS || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTS_PASSWORD || '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows signing (base64 .pfx)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # The draft release stays unpublished if this fails, so an update never goes out signed ad hoc
      # by mistake
      - name: Check that the macOS app carries Hubbub's certificate
        if: runner.os == 'macOS' && env.HUBBUB_MAC_IDENTITY != ''
        shell: bash
        run: |
          for app in dist/mac*/Hubbub.app; do
            requirement="$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')"
            echo "$app: $requirement"
            codesign --verify --deep --strict "$app"
            case "$requirement" in
              *"certificate root"*) ;;
              *) echo "::error::$app is not signed with Hubbub's certificate"; exit 1 ;;
            esac
          done
