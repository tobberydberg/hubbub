<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Hubbub app icon: a speech bubble holding a hub of connected people, with a little buzz.
       Body follows the macOS icon grid (824 px squircle on a 1024 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2f80ff"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="330" y1="380" x2="670" y2="680">
      <stop offset="0" stop-color="#2f80ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1060" flood-opacity="0.35"/>
    </filter>
    <filter id="body-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle body -->
  <g filter="url(#body-shadow)">
    <path fill="url(#bg)" d="M512 100c220 0 296 0 352 56s56 132 56 356-0 300-56 356-132 56-352 56-296 0-352-56-56-132-56-356 0-300 56-356 132-56 352-56z"/>
  </g>
  <path fill="url(#glow)" d="M512 100c220 0 296 0 352 56s56 132 56 356-0 300-56 356-132 56-352 56-296 0-352-56-56-132-56-356 0-300 56-356 132-56 352-56z"/>

  <!-- Buzz -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M727.5 209.9A145 145 0 0 1 830.1 312.5" stroke-width="30"/>
    <path d="M756.4 145.5A215 215 0 0 1 894.5 283.6" stroke-width="30" stroke-opacity="0.5"/>
  </g>

  <!-- Speech bubble -->
  <g filter="url(#shadow)">
    <path fill="url(#bubble)" d="M330 268h330c78 0 128 50 128 128v196c0 78-50 128-128 128H468l-136 104c-14 10-32 1-32-16v-90c-64-8-98-56-98-126V396c0-78 50-128 128-128z"/>
  </g>

  <!-- Hub: three people connected through a centre -->
  <g stroke="url(#ink)" stroke-width="30" stroke-linecap="round">
    <line x1="495" y1="494" x2="372" y2="420"/>
    <line x1="495" y1="494" x2="630" y2="420"/>
    <line x1="495" y1="494" x2="495" y2="624"/>
  </g>
  <g fill="url(#ink)">
    <circle cx="495" cy="494" r="62"/>
    <circle cx="372" cy="420" r="42"/>
    <circle cx="630" cy="420" r="42"/>
    <circle cx="495" cy="636" r="42"/>
  </g>
  <circle cx="495" cy="494" r="24" fill="#ffffff"/>
</svg>
